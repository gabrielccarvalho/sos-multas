services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sosmultas
      POSTGRES_PASSWORD: sosmultas
      POSTGRES_DB: sosmultas
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosmultas -d sosmultas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
